# 新深圳集群 sz-k8s-prod 的 H200。部署前改 NameSpace 和镜像。
# 说明：docs/sz-k8s-prod-h200-network.md
# 这 8 台不能直接访问公网。ExtraEnv 里的代理要保留。
# 不要挂 hostPath。不要把云网的 EPC/NFS 存储类用到这里。
NameSpace: your-namespace
BaseName: sz-h200
ContainerImage: harbor.sz-prod.hqzyai.com:8443/cs-<username>/lab:v1
ImagePullPolicy: IfNotPresent
GPU: H200

Limits:
  CPU: "8"
  memory: 32Gi
  GPU: 1

UseShm: true
ShmSize: 16Gi

# /scratch：调度到的那台 H200 的 /data（2.5T）。helm uninstall 会删除这块 PVC。
Scratch:
  enabled: true
  storageClassName: local-path
  size: 100Gi
  mountPath: /scratch

# /workspace：同一台机器的 /data1（3.5T）。helm uninstall 会删除这块 PVC。
# 已有 PVC 时把 create 改为 false，并填写 claimName。卷不能换节点。
Workspace:
  enabled: true
  create: true
  claimName: ""
  storageClassName: local-path-data1
  size: 200Gi
  accessModes:
    - ReadWriteOnce
  mountPath: /workspace
  readOnly: false

ExtraEnv:
  - name: http_proxy
    value: "http://33.1.42.5:8888"
  - name: https_proxy
    value: "http://33.1.42.5:8888"
  - name: HTTP_PROXY
    value: "http://33.1.42.5:8888"
  - name: HTTPS_PROXY
    value: "http://33.1.42.5:8888"
  - name: no_proxy
    value: "localhost,127.0.0.1,::1,10.244.0.0/16,10.96.0.0/12,.svc,.cluster.local,cluster.local,harbor.sz-prod.hqzyai.com"
  - name: NO_PROXY
    value: "localhost,127.0.0.1,::1,10.244.0.0/16,10.96.0.0/12,.svc,.cluster.local,cluster.local,harbor.sz-prod.hqzyai.com"

Command: '["bash", "-lc", "--"]'
Args: '["cd /workspace && while true; do sleep 3600; done"]'
