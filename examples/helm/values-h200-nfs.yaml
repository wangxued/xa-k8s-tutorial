NameSpace: your-namespace
BaseName: train-h200-nfs
ContainerImage: harbor.xa.hqzyai.com:19443/llm-course/lab:v2
GPU: H200

Limits:
  CPU: "8"
  memory: 32Gi
  GPU: 1

UseShm: true
ShmSize: 16Gi

Scratch:
  enabled: true
  storageClassName: local-path
  size: 100Gi
  mountPath: /scratch

# 默认安全模式：复用已有 PVC。把 claimName 改成 kubectl get pvc 看到的名称。
Workspace:
  enabled: true
  create: false
  claimName: pvc-workspace-your-existing
  storageClassName: h3c-csi-sc-nfs
  mountPath: /workspace
  readOnly: false

# --- 需要 Chart 新建 PVC 时：注释掉上面整段，改用下面 ---
# 警告：helm uninstall 会删除该 PVC。
# Workspace:
#   enabled: true
#   create: true
#   claimName: ""
#   storageClassName: h3c-csi-sc-nfs
#   size: 200Gi
#   accessModes:
#     - ReadWriteMany
#   mountPath: /workspace
#   readOnly: false

Command: '["bash", "-lc", "--"]'
Args: '["cd /workspace && while true; do sleep 3600; done"]'
