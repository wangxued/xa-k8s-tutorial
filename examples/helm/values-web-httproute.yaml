NameSpace: your-namespace
BaseName: web-demo
ContainerImage: harbor.xa.hqzyai.com:19443/llm-course/lab:v2
GPU: H200

Limits:
  CPU: "4"
  memory: 16Gi
  GPU: 1

UseShm: true
ShmSize: 8Gi

# 默认安全模式：复用已有 PVC。把 claimName 改成 kubectl get pvc 看到的名称。
Workspace:
  enabled: true
  create: false
  claimName: pvc-workspace-your-existing
  storageClassName: h3c-csi-sc-nfs
  mountPath: /workspace
  readOnly: false

# --- 需要 Chart 新建 PVC 时：注释掉上面整段，改用下面 ---
# 警告：helm uninstall 会删除该 PVC。
# Workspace:
#   enabled: true
#   create: true
#   claimName: ""
#   storageClassName: h3c-csi-sc-nfs
#   size: 100Gi
#   accessModes:
#     - ReadWriteMany
#   mountPath: /workspace
#   readOnly: false

Scratch:
  enabled: false

ExtraPort: 7860

HTTPRoute:
  enabled: true
  host: demo.xa.hqzyai.com
  parentRef:
    name: yunwang-public
    namespace: envoy-gateway-system
    sectionName: https-wildcard-8443
  servicePort: 7860
  pathPrefix: /

Command: '["bash", "-lc", "--"]'
# 须在 /workspace 准备 app.py，或改为常驻命令以便先验证 HTTPRoute
Args: '["cd /workspace && python app.py --host 0.0.0.0 --port 7860"]'
