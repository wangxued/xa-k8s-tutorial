# xay-ai 默认配置。建议复制到自己的 values 文件后修改。

# 必填：个人 namespace，通常从华清云 SaaS 查看。
NameSpace: ""

# 任务基础名称，用于生成 Deployment、Service、PVC 等资源名。
BaseName: ai-workload

# 容器镜像。示例默认镜像；业务镜像请 push 到 SaaS 分配的个人 Harbor 项目。
ContainerImage: harbor.xa.hqzyai.com:19443/llm-course/lab:v2
ImagePullPolicy: IfNotPresent

# GPU 类型。当前支持 5090、H200、H20；后续 B300 到位后可扩展。
# 5090 与 H20 仅支持 h3c-csi-sc-nfs；H200 支持 h3c-csi-sc-nfs 和 h3c-csi-sc-epc。
# H20 当前只有 1 台（8 卡），仅适用于单机任务，不能用于多机训练。
GPU: H200

Replicas: 1

# Deployment 更新策略。默认 RollingUpdate（滚动更新，尽量保持服务可用）。
Strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%

# 单机多卡占满整节点、或同时挂载 local-path scratch 时，建议改为 Recreate；
# 风险见 charts/xay-ai/README.md「Deployment 更新策略」。
# Strategy:
#   type: Recreate

# 可选：覆盖自动生成名称。
# DeployName: ""
# Label: ""
# ContainerName: ""

# 可选：显式指定容器运行用户。不设置时跟随镜像自身默认用户。
# UID: 1000
# GID: 1000

# Limits.GPU 为卡数。设为 0 时默认不申请 GPU，也不会调度到 GPU 节点。
# 预热（传数据 / 配环境）请设 Limits.GPU: 0，并打开 ScheduleOnGPUNode
#（Workspace 为 h3c-csi-sc-epc 时会自动钉到 H200）。详见 README「调度说明」。
Limits:
  CPU: "8"
  memory: 32Gi
  GPU: 1

# 不占卡但仍调度到 GPU 节点（挂 EPC、预热环境）。Limits.GPU > 0 时无需打开。
# 预热场景 CPU 不得超过 16、内存不得超过 64Gi。
ScheduleOnGPUNode: false

# 共享内存，常用于 PyTorch DataLoader、Ray、浏览器渲染等场景。
UseShm: true
ShmSize: 16Gi

# 使用 NVIDIA EGL 相关库。需要镜像和节点环境支持。
UseEGL: false
EGLImage: harbor.xa.hqzyai.com:19443/infra/nvidia-egl-libs:latest

# 自定义启动命令。留空时容器常驻。
# Command: '["bash", "-lc", "--"]'
# Args: '["python /workspace/train.py"]'
Command: ""
Args: ""

# 临时 scratch PVC。删除 Helm release 时会删除该 PVC。
Scratch:
  enabled: true
  storageClassName: local-path
  size: 100Gi
  mountPath: /scratch

# 工作目录。默认安全模式：create: false，必须填写已有 PVC 的 claimName。
# helm uninstall 不会删除该 PVC。
# 若需 Chart 新建 PVC，将 create 改为 true 并填写 storageClassName/size
#（警告：uninstall 会删除新建的 PVC，/workspace 数据丢失）。
Workspace:
  enabled: true
  create: false
  claimName: ""
  storageClassName: h3c-csi-sc-epc
  size: 200Gi
  accessModes:
    - ReadWriteMany
  mountPath: /workspace
  readOnly: false

# 需要 Chart 新建 PVC 时：
# Workspace:
#   enabled: true
#   create: true
#   claimName: ""
#   storageClassName: h3c-csi-sc-epc
#   size: 200Gi
#   accessModes:
#     - ReadWriteMany
#   mountPath: /workspace
#   readOnly: false
#
# 不需要 /workspace 时：
# Workspace:
#   enabled: false

# 公共模型权重。默认不开启；仅在平台已提供公共模型 PVC 并告知 claimName 后启用。
# Chart 不会自动创建公共模型 PVC。
SharedModels:
  enabled: false
  claimName: ""
  mountPath: /models
  readOnly: true

# 公共读写共享目录。默认关闭；仅复用平台已提供的公共读写 PVC。
# 启用前需确认权限、配额、文件属主、并发写入和回收策略。
SharedWritable:
  enabled: false
  claimName: ""
  mountPath: /shared
  readOnly: false

Service:
  enabled: true
  type: ClusterIP
  ports:
    - name: ssh
      port: 22
      targetPort: 22

# 兼容旧配置：如果只需要额外暴露一个 Web 端口，可直接设置 ExtraPort。
# ExtraPort: 7860
ExtraPort: 0

# Gateway API HTTPRoute。域名需按平台规则申请。
HTTPRoute:
  enabled: false
  host: ""
  parentRef:
    name: yunwang-public
    namespace: envoy-gateway-system
    sectionName: https-wildcard-8443
  servicePort: 7860
  pathPrefix: /

# 额外调度配置。
NodeSelector: {}
Tolerations: []
Affinity: {}

ExtraEnv: []
ExtraVolumeMounts: []
ExtraVolumes: []
