{{- $gpuType := toString (.Values.GPU | default "") -}}
{{- $gpuCount := int (.Values.Limits.GPU | default 0) -}}
{{- $pinToGPU := or (gt $gpuCount 0) (.Values.ScheduleOnGPUNode | default false) (and .Values.Workspace.enabled (eq (.Values.Workspace.storageClassName | default "") "h3c-csi-sc-epc")) -}}
{{- if and (has $gpuType (list "5090" "H20")) .Values.Workspace.enabled (eq .Values.Workspace.storageClassName "h3c-csi-sc-epc") -}}
{{- fail (printf "%s nodes only support h3c-csi-sc-nfs. Change Workspace.storageClassName to h3c-csi-sc-nfs." $gpuType) -}}
{{- end -}}
{{- if and .Values.Workspace.enabled (not .Values.Workspace.create) (not .Values.Workspace.claimName) -}}
{{- fail "安全模式：Workspace.create 为 false 时必须填写已有 PVC 的 claimName。若需由 Chart 新建 PVC，将 Workspace.create 设为 true（helm uninstall 会删除该 PVC）。不要用 Workspace.enabled=false 来复用 PVC。" -}}
{{- end -}}
{{- if and .Values.SharedModels.enabled (not .Values.SharedModels.claimName) -}}
{{- fail "SharedModels.claimName is required when SharedModels.enabled is true." -}}
{{- end -}}
{{- if and .Values.SharedWritable.enabled (not .Values.SharedWritable.claimName) -}}
{{- fail "SharedWritable.claimName is required when SharedWritable.enabled is true." -}}
{{- end -}}
{{- if $pinToGPU -}}
{{- if not (has $gpuType (list "H200" "5090" "H20")) -}}
{{- fail "Scheduling onto GPU nodes requires GPU to be H200, 5090, or H20." -}}
{{- end -}}
{{- end -}}
{{- if and $pinToGPU (le $gpuCount 0) -}}
{{- $cpuStr := toString (.Values.Limits.CPU | default "") -}}
{{- if not (regexMatch "^[0-9]+$" $cpuStr) -}}
{{- fail "预热任务（Limits.GPU 为 0 且调度到 GPU 节点）的 Limits.CPU 必须是整数核（如 \"8\" 或 \"16\"），且不得超过 16。请改小 CPU，或改用占卡 values（Limits.GPU > 0）。" -}}
{{- end -}}
{{- if gt (int $cpuStr) 16 -}}
{{- fail "预热任务（Limits.GPU 为 0 且调度到 GPU 节点）的 CPU 不得超过 16 核。请改小 Limits.CPU，或改用占卡 values（Limits.GPU > 0）。" -}}
{{- end -}}
{{- $memStr := toString (.Values.Limits.memory | default "") -}}
{{- if not (regexMatch "^[0-9]+Gi$" $memStr) -}}
{{- fail "预热任务（Limits.GPU 为 0 且调度到 GPU 节点）的 Limits.memory 必须带 Gi 后缀（如 32Gi 或 64Gi），且不得超过 64Gi。请改小内存，或改用占卡 values（Limits.GPU > 0）。" -}}
{{- end -}}
{{- if gt (int (trimSuffix "Gi" $memStr)) 64 -}}
{{- fail "预热任务（Limits.GPU 为 0 且调度到 GPU 节点）的内存不得超过 64Gi。请改小 Limits.memory，或改用占卡 values（Limits.GPU > 0）。" -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xay-ai.fullname" . }}
  namespace: {{ include "xay-ai.namespace" . }}
  labels:
{{ include "xay-ai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.Replicas | default 1 }}
{{- if eq (.Values.Strategy.type | default "RollingUpdate") "Recreate" }}
  strategy:
    type: Recreate
{{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.Strategy.rollingUpdate.maxSurge | default "25%" | quote }}
      maxUnavailable: {{ .Values.Strategy.rollingUpdate.maxUnavailable | default "25%" | quote }}
{{- end }}
  selector:
    matchLabels:
{{ include "xay-ai.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
{{ include "xay-ai.selectorLabels" . | nindent 8 }}
    spec:
{{- if or (hasKey .Values "UID") (hasKey .Values "GID") }}
      securityContext:
{{- if hasKey .Values "UID" }}
        runAsUser: {{ .Values.UID }}
{{- end }}
{{- if hasKey .Values "GID" }}
        runAsGroup: {{ .Values.GID }}
{{- end }}
{{- end }}
{{- if or $pinToGPU .Values.NodeSelector }}
      nodeSelector:
{{- if $pinToGPU }}
        gpu-type: {{ $gpuType | quote }}
{{- end }}
{{- with .Values.NodeSelector }}
{{ toYaml . | nindent 8 }}
{{- end }}
{{- end }}
{{- if or $pinToGPU .Values.Tolerations }}
      tolerations:
{{- if $pinToGPU }}
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
{{- end }}
{{- with .Values.Tolerations }}
{{ toYaml . | nindent 8 }}
{{- end }}
{{- end }}
{{- with .Values.Affinity }}
      affinity:
{{ toYaml . | nindent 8 }}
{{- end }}
{{- if .Values.UseEGL }}
      initContainers:
        - name: init-egl-libs
          image: {{ .Values.EGLImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["cp", "-a", "/egl-libs/.", "/target/"]
          volumeMounts:
            - name: egl-libs
              mountPath: /target
{{- end }}
      containers:
        - name: {{ include "xay-ai.containerName" . }}
          image: {{ .Values.ContainerImage | quote }}
          imagePullPolicy: {{ .Values.ImagePullPolicy | default "IfNotPresent" }}
{{- if .Values.Command }}
          command: {{ .Values.Command }}
{{- if .Values.Args }}
          args: {{ .Values.Args }}
{{- end }}
{{- else }}
          command: ["bash", "-lc", "--"]
          args: ["while true; do sleep 3600; done"]
{{- end }}
{{- if or .Values.UseEGL .Values.ExtraEnv }}
          env:
{{- if .Values.UseEGL }}
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility,graphics"
            - name: __EGL_VENDOR_LIBRARY_DIRS
              value: "/egl-libs/glvnd"
            - name: LD_LIBRARY_PATH
              value: "/egl-libs/lib"
{{- end }}
{{- with .Values.ExtraEnv }}
{{ toYaml . | nindent 12 }}
{{- end }}
{{- end }}
          ports:
{{- range .Values.Service.ports }}
            - name: {{ .name }}
              containerPort: {{ .targetPort | default .port }}
              protocol: TCP
{{- end }}
{{- if .Values.ExtraPort }}
            - name: extra
              containerPort: {{ .Values.ExtraPort }}
              protocol: TCP
{{- end }}
          resources:
            limits:
              cpu: {{ .Values.Limits.CPU | quote }}
              memory: {{ .Values.Limits.memory | quote }}
{{- if gt $gpuCount 0 }}
              nvidia.com/gpu: {{ $gpuCount }}
{{- end }}
            requests:
              cpu: {{ .Values.Limits.CPU | quote }}
              memory: {{ .Values.Limits.memory | quote }}
{{- if gt $gpuCount 0 }}
              nvidia.com/gpu: {{ $gpuCount }}
{{- end }}
          volumeMounts:
{{- if .Values.Workspace.enabled }}
            - name: workspace
              mountPath: {{ .Values.Workspace.mountPath | default "/workspace" }}
              readOnly: {{ .Values.Workspace.readOnly | default false }}
{{- end }}
{{- if .Values.Scratch.enabled }}
            - name: scratch
              mountPath: {{ .Values.Scratch.mountPath | default "/scratch" }}
{{- end }}
{{- if .Values.SharedModels.enabled }}
            - name: shared-models
              mountPath: {{ .Values.SharedModels.mountPath | default "/models" }}
              readOnly: {{ .Values.SharedModels.readOnly | default true }}
{{- end }}
{{- if .Values.SharedWritable.enabled }}
            - name: shared-writable
              mountPath: {{ .Values.SharedWritable.mountPath | default "/shared" }}
              readOnly: {{ .Values.SharedWritable.readOnly | default false }}
{{- end }}
{{- if .Values.UseShm }}
            - name: dshm
              mountPath: /dev/shm
{{- end }}
{{- if .Values.UseEGL }}
            - name: egl-libs
              mountPath: /egl-libs
              readOnly: true
{{- end }}
{{- with .Values.ExtraVolumeMounts }}
{{ toYaml . | nindent 12 }}
{{- end }}
      volumes:
{{- if .Values.Workspace.enabled }}
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "xay-ai.workspaceClaimName" . }}
{{- end }}
{{- if .Values.Scratch.enabled }}
        - name: scratch
          persistentVolumeClaim:
            claimName: {{ include "xay-ai.scratchClaimName" . }}
{{- end }}
{{- if .Values.SharedModels.enabled }}
        - name: shared-models
          persistentVolumeClaim:
            claimName: {{ .Values.SharedModels.claimName }}
{{- end }}
{{- if .Values.SharedWritable.enabled }}
        - name: shared-writable
          persistentVolumeClaim:
            claimName: {{ .Values.SharedWritable.claimName }}
{{- end }}
{{- if .Values.UseShm }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.ShmSize | default "16Gi" }}
{{- end }}
{{- if .Values.UseEGL }}
        - name: egl-libs
          emptyDir:
            sizeLimit: 200Mi
{{- end }}
{{- with .Values.ExtraVolumes }}
{{ toYaml . | nindent 8 }}
{{- end }}
